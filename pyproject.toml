[project]
name = "bcp-sdk"
version = "0.1.0a1"
description = "BCP Python SDK"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "BCP Authors" }]
keywords = ["bcp", "ucp", "commerce", "agentic", "pix", "protocol", "brasil"]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
# Same floor as ucp-sdk and a2a-sdk. The real constraint is the `X | None`
# annotations in the generated models, which need 3.10.
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.5.0",
    "email-validator>=2.0.0",
]

[project.urls]
Homepage = "https://bcp.dev.br"
Repository = "https://github.com/Brazilian-Commerce-Protocol/python-sdk"
Specification = "https://github.com/ceia-br/bcp"

[dependency-groups]
dev = [
    # Pinned, not a range: the generator's output is a committed artifact. 0.70.0
    # dropped the docstring for `additionalProperties` values, so 0.69.0 is the
    # newest release that still documents them. Bumping is a reviewable diff.
    "datamodel-code-generator[http,ruff]==0.69.0",
    "pytest>=8.0",
    "ruff>=0.15",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bcp_sdk"]

# Neutral header stamped on every generated model. No per-file copyright claim;
# attribution and statement of modifications live in LICENSE and NOTICE (Apache 2.0).
[tool.datamodel-codegen]
custom-file-header = """# Generated by datamodel-codegen. Do not edit.
# Part of the Brazilian Commerce Protocol (BCP), derived in part from the
# Universal Commerce Protocol (UCP), Apache License 2.0.
# See LICENSE and NOTICE for copyright, attribution, and modifications."""
