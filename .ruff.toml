# Standalone config (in the monorepo this extended the root pyproject). Excludes
# the generated models and the scripts vendored from the UCP python-sdk: none of
# them follow our style, and the vendored ones must stay close to upstream.
# target-version matches requires-python, so pyupgrade never rewrites code into
# syntax the floor does not support.
target-version = "py310"
line-length = 100
src = ["src", "tests"]
extend-exclude = [
    "src/bcp_sdk/models",
    "preprocess_schemas.py",
    "postprocess_models.py",
]

[lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "N",        # pep8-naming
    "UP",       # pyupgrade
    "B",        # flake8-bugbear
    "C4",       # flake8-comprehensions
    "SIM",      # flake8-simplify
    "S",        # flake8-bandit (security)
    "ANN",      # flake8-annotations
    "RUF",      # regras especificas do ruff
]
ignore = [
    "E501",     # line length: the formatter handles it
    "ANN401",   # Any is allowed where it is the honest type
    "ANN204",   # no -> None required on __init__/dunder
]

[lint.per-file-ignores]
"tests/**" = ["S101", "ANN"]
"**/__init__.py" = ["F401"]

[format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true
